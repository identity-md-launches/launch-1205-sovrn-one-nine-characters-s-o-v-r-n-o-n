  /* Tokens from the Sovrn.One brand: white ground and navy ink in light, the robot's navy in dark. Follows the system. */
  :root {
    --ink: #0b1f4d; --ink-2: #4a5a82; --ink-3: #8290b2;
    --line: #d9e0ee; --plate: #ffffff; --plate-2: #f5f8fd; --plate-line-hover: #c9d2e6;
    --blue: #1f6feb; --blue-ink: #1649b8; --blue-hover: #1a55d2;
    --led: #5fd8ff;
    --shadow: 0 1px 2px rgba(11, 31, 77, 0.06), 0 8px 20px -10px rgba(11, 31, 77, 0.22);
    --primary-shadow: 0 1px 2px rgba(22, 73, 184, 0.35), 0 10px 24px -8px rgba(31, 111, 235, 0.6);
    --ground: #ffffff;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eaf0ff; --ink-2: #aab8de; --ink-3: #7384ad;
      --line: rgba(173, 196, 255, 0.16); --plate: #0b1e4f; --plate-2: #122a66; --plate-line-hover: rgba(173, 196, 255, 0.28);
      --blue-ink: #2b6fe8; --blue-hover: #3b7ff0;
      --shadow: 0 1px 2px rgba(0, 8, 30, 0.35), 0 10px 24px -10px rgba(0, 8, 30, 0.7);
      --primary-shadow: 0 1px 2px rgba(0, 8, 30, 0.5), 0 12px 28px -8px rgba(43, 111, 232, 0.75);
      --ground: #04153f;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh; display: flex; flex-direction: column;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--ground);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: #cdebff; color: #0b1f4d; }

  /* Header */
  .header { height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .led {
    width: 8px; height: 8px; border-radius: 999px; flex: none; background: var(--led);
    box-shadow: 0 0 0 2px rgba(95, 216, 255, 0.22), 0 0 10px rgba(95, 216, 255, 0.95);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .wordmark { font-family: 'Audiowide', 'Rubik', sans-serif; letter-spacing: 0.02em; font-size: 1.05rem; line-height: 1; }
  .nav { display: flex; align-items: center; gap: 4px; min-width: 0; }

  /* Buttons and plates */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    height: 44px; padding: 0 1.25rem; border-radius: 999px;
    font-size: 0.9375rem; font-weight: 500; line-height: 1; white-space: nowrap;
    border: 1px solid transparent; cursor: pointer; user-select: none;
    transition: background-color 180ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
      transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 180ms;
  }
  .btn:active { transform: translateY(1px); }
  .btn-sm { height: 34px; padding: 0 0.875rem; font-size: 0.8125rem; }
  .btn-primary { background: var(--blue-ink); color: #fff; box-shadow: var(--primary-shadow); }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-plate { background: var(--plate); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow); }
  .btn-plate:hover { background: var(--plate-2); border-color: var(--plate-line-hover); }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--plate-2); color: var(--ink); }
  .plate {
    display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
    background: var(--plate); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    font-size: 0.75rem; font-weight: 600;
  }

  /* Hero: full bleed, shaded image, centred wordmark */
  .hero { position: relative; isolation: isolate; flex: 1; min-height: min(92svh, 880px); display: flex; align-items: center; overflow: hidden; background: #070a10; }
  .hero-img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
  .hero-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(7,10,16,0.35) 0%, rgba(7,10,16,0.5) 45%, rgba(7,10,16,0.86) 100%); }
  .hero-inner { width: 100%; max-width: 1360px; margin: 0 auto; padding: 96px 20px 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  h1 {
    margin: 0; color: #fff; font-family: 'Audiowide', 'Rubik', sans-serif; font-weight: 400;
    font-size: clamp(96px, 19vw, 260px); line-height: 0.9; letter-spacing: -0.06em;
    text-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .lede { margin: 0; max-width: 46ch; font-size: 1.125rem; line-height: 1.55; color: rgba(255,255,255,0.85); }
  .actions { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }

  /* Footer */
  .footer { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding: 20px; font-size: 0.75rem; color: var(--ink-3); }
  .footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .footer a { color: var(--ink-2); }
  .footer a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  @media (min-width: 640px) {
    .header { padding: 0 32px; }
    .wordmark { font-size: 1.15rem; }
    .nav { gap: 8px; }
    .hero-inner { padding-left: 40px; padding-right: 40px; }
    .footer { padding: 20px 32px; }
  }
  @media (max-width: 420px) { .nav .btn-ghost { display: none; } }
  @media (prefers-reduced-motion: reduce) { .led { animation: none; } .btn { transition: none; } }
